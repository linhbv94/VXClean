name: VXClean checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select exact macOS SDK27.0
        if: runner.os == 'macOS'
        run: node scripts/macos_sdk_gate.mjs --select-ci
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --lib
        working-directory: desktop/src_tauri
      - name: Native safety and lifecycle fixtures
        run: python3 scripts/test_native_maintenance.py
      - name: Manager cleanup fixtures
        run: python3 scripts/test_manager_cleanup.py
      - name: Release signing and publish guards
        run: node --test scripts/test_release_automation.mjs
      - name: Recovery notification and independent history
        run: node scripts/test_operation_history.mjs
      - run: node scripts/test_folder_scan_cache.mjs
      - run: node scripts/test_scan_access.mjs
      - run: node scripts/test_scan_retention.cjs
      - run: node scripts/test_uninstall_selection.cjs
      - run: node scripts/test_circle_packing.cjs

  windows_dummy:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select exact macOS SDK27.0
        if: runner.os == 'macOS'
        run: node scripts/macos_sdk_gate.mjs --select-ci
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: cargo test --locked --lib maintenance_bridge::tests
        working-directory: desktop/src_tauri
      - run: npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: desktop
      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop/src_tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1 -or $installers[0].Length -le 0) { throw "Expected one NSIS installer" }
